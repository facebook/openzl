# cmake-ci already compiles tools/wasm/src/openzl_wasm.cpp natively and runs
# its gtest. This workflow verifies that Emscripten produces a WASM artifact,
# the same one the docs deploy, and runs wasm_api.js against it.

name: wasm-ci

on:
  push:
    branches: [dev]
    paths:
      - 'tools/wasm/**'
      # The binding links the training tools and the CLI's profile graphs.
      - 'tools/training/**'
      - 'tools/io/**'
      - 'tools/logger/**'
      - 'cli/utils/profile_graphs.*'
      - 'custom_parsers/**'
      - 'cpp/**'
      - 'src/**'
      - 'include/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/wasm-ci.yml'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    branches: [dev, master, actionsTest]
    paths:
      - 'tools/wasm/**'
      # The binding links the training tools and the CLI's profile graphs.
      - 'tools/training/**'
      - 'tools/io/**'
      - 'tools/logger/**'
      - 'cli/utils/profile_graphs.*'
      - 'custom_parsers/**'
      - 'cpp/**'
      - 'src/**'
      - 'include/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/wasm-ci.yml'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wasm:
    uses: ./.github/workflows/build-wasm.yml

  test:
    name: wasm_api.js integration tests
    needs: wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Next to wasm_api.js, so `import openzlModule from './openzl.js'`
      # resolves in Node as it does in the browser.
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: openzl-wasm
          path: tools/wasm/js

      - name: Run wasm_api.js integration tests
        run: node --test tools/wasm/js/tests/wasm_api.test.js
