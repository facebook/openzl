# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Bumping Emscripten means editing this and the matching line in wasm-ci.yml;
# a workflow-level env cannot reach across files. The two deploy workflows at
# least move together.
env:
  EMSDK_VERSION: 4.0.19

jobs:
  # This should be synced to the "wasm" job in test-deploy-docs.yml
  wasm:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Restoring the artifact is what keeps a docs-only change off the
      # Emscripten toolchain entirely. The key covers everything the binding
      # links -- the set wasm-ci.yml filters on, `**/CMakeLists.txt` included,
      # kept deliberately broad so the two cannot drift apart -- plus two things
      # that shape the artifact without being linked into it: build-scripts/cmake,
      # which decides the compile flags, and both deploy workflows.
      #
      # Both files rather than just this one: the keys have to be identical for
      # a pull request to restore what the branch build already compiled.
      - name: Cache WASM artifact
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: build-wasm/tools/wasm
          key: >-
            openzl-wasm-${{runner.os}}-emsdk${{env.EMSDK_VERSION}}-${{hashFiles(
            'tools/wasm/**', 'tools/training/**', 'tools/io/**',
            'tools/logger/**', 'cli/utils/profile_graphs.*',
            'custom_parsers/**', 'cpp/**', 'src/**', 'include/**',
            '**/CMakeLists.txt', 'build-scripts/cmake/**',
            '.github/workflows/deploy-docs.yml',
            '.github/workflows/test-deploy-docs.yml')}}
      - name: Set up Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{env.EMSDK_VERSION}}
          actions-cache-folder: emsdk-cache
      - name: Configure
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        # The build type only reaches the libraries the binding links, since
        # tools/wasm/CMakeLists.txt pins the artifact itself to -O3. Release
        # rather than MinSizeRel: the playground exists to report MB/s, and -Os
        # costs about 14% of compression throughput.
        run: emcmake cmake -DOPENZL_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release -B build-wasm
      - name: Build
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cmake --build build-wasm --target openzl_wasm -j$(getconf _NPROCESSORS_ONLN)
      # Release inherits `-g` from build-scripts/cmake/OpenZLCompilerUnix.cmake,
      # which is 40 of the 45 MB it produces. Worth stripping for that alone,
      # but the DWARF is also load-bearing: emcc skips binaryen's post-link pass
      # when debug info has to survive, and on this workload that pass costs
      # about a quarter of the compression throughput. So the module is built
      # with debug info, kept out of that pass, and stripped afterwards.
      #
      # It follows that removing that `-g` upstream would quietly cost the
      # deployed tool 25%, with nothing here to notice -- so
      # tools/wasm/CMakeLists.txt states `-g` on the target rather than
      # inheriting it, and this step is what undoes it again.
      - name: Strip debug info
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: emstrip --strip-debug build-wasm/tools/wasm/openzl.wasm
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: openzl-wasm
          path: |
            build-wasm/tools/wasm/openzl.js
            build-wasm/tools/wasm/openzl.wasm
          retention-days: 1

  # This should be synced to the "build" step in test-deploy-docs.yml
  build:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'
          cache-dependency-path: ${{github.workspace}}/tools/web/yarn.lock
      # Next to wasm_api.js, which is the only place it is needed: that module
      # imports the glue relatively and locates the binary with
      # `new URL('./openzl.wasm', import.meta.url)`, which Vite resolves at
      # build time and re-emits under assets/ with a content hash.
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: openzl-wasm
          path: ${{github.workspace}}/tools/wasm/js
      - name: Install yarn dependencies
        working-directory: ${{github.workspace}}/tools/web
        run: yarn --frozen-lockfile
      - name: Build web tools
        working-directory: ${{github.workspace}}/tools/web
        run: yarn build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup mkdocs environment
        run: |
            sudo apt-get update
            sudo apt-get install doxygen clang-format
            pip install mkdocs-material==9.5.50 mkdocstrings==0.27.0 mkdocs==1.6.1 mkdocstrings-python==1.13.0
      - name: build
        run: |
            ./doc/mkdocs/github_pages_build_script.py
      # Cross-origin isolation, and so the module itself, rests on Vite having
      # rewritten this src against the tool's base. Nothing else would catch it
      # regressing: the page renders fine, and only fails when a run starts.
      - name: Check the isolation worker is referenced under the tool's base
        run: grep -q '"/tools/playground/cross-origin-isolation-sw.js"' doc/mkdocs/build/tools/playground/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './doc/mkdocs/build/'


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
