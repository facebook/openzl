# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # This should be synced to the "build" step in test-deploy-docs.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'
          cache-dependency-path: ${{github.workspace}}/tools/web/yarn.lock
      # The playground loads the OpenZL engine as WASM. That artifact is
      # gitignored, and wasm-ci.yml builds it only to run its own tests, so the
      # deploy has to produce its own copy before Vite bundles the web tools.
      # Keep the emsdk version in sync with wasm-ci.yml.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.19
          actions-cache-folder: emsdk-cache
      - name: Build WASM artifact
        run: |
            emcmake cmake -DOPENZL_BUILD_WASM=ON -B build-wasm
            cmake --build build-wasm --target openzl_wasm -j$(getconf _NPROCESSORS_ONLN)
      - name: Stage WASM artifact
        # `wasm_api.js` resolves `./openzl.js` relative to itself. The explicit
        # checks keep a staging failure from reaching Pages as a site whose
        # engine silently 404s -- nothing imports the artifact yet, so until the
        # run seam lands a missing copy would otherwise deploy green.
        run: |
            cp build-wasm/tools/wasm/openzl.{js,wasm} tools/wasm/js/
            test -f tools/wasm/js/openzl.js
            test -f tools/wasm/js/openzl.wasm
      - name: Install yarn dependencies
        working-directory: ${{github.workspace}}/tools/web
        run: yarn --frozen-lockfile
      - name: Build web tools
        working-directory: ${{github.workspace}}/tools/web
        run: yarn build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup mkdocs environment
        run: |
            sudo apt-get update
            sudo apt-get install doxygen clang-format
            pip install mkdocs-material==9.5.50 mkdocstrings==0.27.0 mkdocs==1.6.1 mkdocstrings-python==1.13.0
      - name: build
        run: |
            ./doc/mkdocs/github_pages_build_script.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './doc/mkdocs/build/'


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
