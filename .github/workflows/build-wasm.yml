# Builds the Emscripten artifact for every workflow that needs it: the docs
# workflows deploy it inside the playground and wasm-ci tests it. Callers
# download it as the artifact named by `artifact-name`.
name: Build WASM artifact

on:
  workflow_call:
    inputs:
      # The docs deploy Release, which compiles out ZL_ASSERT and ZLDLOG, so
      # wasm-ci also builds Debug to keep them exercised.
      build-type:
        type: string
        default: Release
      # Distinct per build type, since one run cannot upload the same name twice.
      artifact-name:
        type: string
        default: openzl-wasm

# The one place Emscripten is pinned.
env:
  EMSDK_VERSION: 4.0.19

jobs:
  wasm:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Restoring the artifact is what keeps a docs-only change off the
      # Emscripten toolchain entirely. The key covers everything the binding
      # links -- the set wasm-ci.yml filters on, `**/CMakeLists.txt` included,
      # kept deliberately broad so the two cannot drift apart -- plus two things
      # that shape the artifact without being linked into it: build-scripts/cmake,
      # which decides the compile flags, and this workflow.
      - name: Cache WASM artifact
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: build-wasm/tools/wasm
          key: >-
            openzl-wasm-${{runner.os}}-emsdk${{env.EMSDK_VERSION}}-${{inputs.build-type}}-${{hashFiles(
            'tools/wasm/**', 'tools/training/**', 'tools/io/**',
            'tools/logger/**', 'cli/utils/profile_graphs.*',
            'custom_parsers/**', 'cpp/**', 'src/**', 'include/**',
            '**/CMakeLists.txt', 'build-scripts/cmake/**',
            '.github/workflows/build-wasm.yml')}}
      - name: Set up Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{env.EMSDK_VERSION}}
          actions-cache-folder: emsdk-cache
      - name: Configure
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        # The build type only reaches the libraries the binding links, since
        # tools/wasm/CMakeLists.txt pins the artifact itself to -O3. Release
        # rather than MinSizeRel: the playground exists to report MB/s, and -Os
        # costs about 14% of compression throughput.
        run: emcmake cmake -DOPENZL_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=${{inputs.build-type}} -B build-wasm
      - name: Build
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cmake --build build-wasm --target openzl_wasm -j$(getconf _NPROCESSORS_ONLN)
      # Release inherits `-g` from build-scripts/cmake/OpenZLCompilerUnix.cmake,
      # which is 40 of the 45 MB it produces. Worth stripping for that alone,
      # but the DWARF is also load-bearing: emcc skips binaryen's post-link pass
      # when debug info has to survive, and on this workload that pass costs
      # about a quarter of the compression throughput. So the module is built
      # with debug info, kept out of that pass, and stripped afterwards.
      #
      # It follows that removing that `-g` upstream would quietly cost the
      # deployed tool 25%, with nothing here to notice -- so
      # tools/wasm/CMakeLists.txt states `-g` on the target rather than
      # inheriting it, and this step is what undoes it again.
      - name: Strip debug info
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: emstrip --strip-debug build-wasm/tools/wasm/openzl.wasm
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.artifact-name}}
          path: |
            build-wasm/tools/wasm/openzl.js
            build-wasm/tools/wasm/openzl.wasm
          # Otherwise a build that produced nothing uploads nothing and passes,
          # and the run fails a job later where the download comes up empty.
          if-no-files-found: error
          retention-days: 1
